<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>32 Academia — Gestão de Alunos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #ef4444;
      --primary-hover: #dc2626;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.14);
      --red-bg: rgba(239, 68, 68, 0.16);
      --whatsapp: #25d366;
      --border: #334155;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 96px; }

    header {
      background: var(--card-2);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
      flex-shrink: 0;
    }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: 0.3px; }
    .brand-sub { font-size: 11px; color: var(--muted); }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    h2 { font-size: 16px; margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
    }
    textarea { min-height: 76px; resize: vertical; }
