<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1526" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>32 Academia — Gestão Profissional</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --ink: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --border-strong: #0f172a;
      --navy: #0b1526;
      --navy-2: #162844;
      --copper: #c87d4b;
      --copper-soft: rgba(200, 125, 75, 0.14);
      --green: #16a34a;
      --green-dark: #15803d;
      --red: #dc2626;
      --red-dark: #b91c1c;
      --whatsapp: #25d366;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--ink); min-height: 100vh; padding-bottom: 44px; -webkit-font-smoothing: antialiased; }

    header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      border-bottom: 2px solid rgba(200, 125, 75, 0.45);
      padding: 13px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(11, 21, 38, 0.22);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-badge {
      width: 52px;
      height: 46px;
      border-radius: 12px;
      background: #070e1a;
      border: 2px solid var(--copper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }
    .brand-num { font-size: 17px; font-weight: 900; font-style: italic; color: #ffffff; letter-spacing: -0.5px; }
    .brand-acad { font-size: 8px; font-weight: 800; color: var(--copper); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .brand-title { font-size: 17px; font-weight: 900; color: #ffffff; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { font-size: 11px; color: #cbd5e1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-header-light {
      background: rgba(255, 255, 255, 0.96);
      color: var(--navy);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid #e2e8f0;
    }

    h2 { font-size: 18px; font-weight: 900; color: var(--ink); letter-spacing: -0.2px; }
    h3 { font-size: 15px; font-weight: 800; margin-bottom: 8px; color: var(--ink); }
    p.desc { font-size: 13px; color: var(--muted); line-height: 1.45; }

    label { display: block; font-size: 12px; color: var(--ink); margin-bottom: 5px; margin-top: 11px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      padding: 12px 13px;
      border-radius: 11px;
      border: 1.5px solid #cbd5e1;
      background: var(--surface-2);
      color: var(--ink);
      font-size: 15px;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--navy-2);
      box-shadow: 0 0 0 3px rgba(22, 40, 68, 0.12);
    }
    textarea { min-height: 86px; resize: vertical; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
      color: var(--ink);
      transition: transform 0.08s ease, background 0.14s ease, box-shadow 0.14s ease;
    }
    button:active { transform: scale(0.985); }
    button:hover { background: #f1f5f9; }
    button:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 100%);
      color: #ffffff;
      border-color: var(--navy);
      width: 100%;
      margin-top: 14px;
      box-shadow: 0 4px 12px rgba(11, 21, 38, 0.18);
    }
    .btn-primary:hover { filter: brightness(1.06); }

    .btn-install {
      background: linear-gradient(180deg, #d98a55 0%, var(--copper) 100%);
      color: #070e1a;
      border-color: #7c4722;
      width: 100%;
      margin-top: 10px;
      font-weight: 900;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid #94a3b8;
      width: 100%;
    }

    .btn-close-x {
      background: var(--surface-2);
      border: 1.5px solid #cbd5e1;
      color: var(--ink);
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn-exit-bottom {
      background: var(--surface-2);
      border: 1.5px solid #cbd5e1;
      color: var(--ink);
      width: 100%;
      margin-top: 14px;
    }

    .btn-sm { padding: 8px 11px; font-size: 12px; border-radius: 9px; }
    .btn-wa {
      background: var(--whatsapp);
      color: #052e16;
      border-color: #15803d;
      font-weight: 900;
    }
    .btn-wa:hover { background: #22c55e; }

    .status-pill-btn {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #ffffff;
      border: none;
    }
    .pill-green { background: var(--green-dark); box-shadow: 0 2px 6px rgba(21, 128, 61, 0.25); }
    .pill-green:hover { background: var(--green); }
    .pill-red { background: var(--red-dark); box-shadow: 0 2px 6px rgba(185, 28, 28, 0.25); }
    .pill-red:hover { background: var(--red); }

    .pix-box {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
    }

    .month-bar {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .finance-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 12px 0;
    }
    .finance-box {
      background: var(--surface-2);
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .finance-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .finance-val { font-size: 20px; font-weight: 900; color: var(--navy); }
    .finance-val.in { color: var(--green-dark); }
    .finance-val.out { color: var(--red-dark); }
    .finance-val.profit { color: var(--green-dark); }
    .finance-val.loss { color: var(--red-dark); }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .summary-tile {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .summary-num { font-size: 20px; font-weight: 900; color: var(--navy); line-height: 1.1; }
    .summary-num.ok { color: var(--green-dark); }
    .summary-num.pend { color: var(--red-dark); }
    .summary-lbl { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 3px; }

    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .menu-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 15px 16px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--ink);
      width: 100%;
      box-shadow: var(--shadow);
    }
    .menu-btn:hover {
      background: #ffffff;
      border-color: var(--navy-2);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .menu-btn-left { display: flex; align-items: center; gap: 14px; }
    .menu-icon {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
      border: 1.5px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .menu-title { font-size: 16px; font-weight: 900; display: block; color: var(--ink); }
    .menu-sub { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-top: 2px; }
    .menu-arrow { font-size: 22px; color: var(--copper); font-weight: 900; }

    .bottom-emblem-card {
      margin-top: 16px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      border: 1.5px solid rgba(200, 125, 75, 0.5);
      border-radius: 20px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }
    .emblem-box-big {
      width: 116px;
      height: 100px;
      border-radius: 20px;
      background: #070e1a;
      border: 2px solid var(--copper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), inset 0 0 0 1px var(--copper-soft);
    }
    .emblem-num-big { font-size: 38px; font-weight: 900; font-style: italic; color: #ffffff; letter-spacing: -1px; }
    .emblem-acad-big { font-size: 13px; font-weight: 800; color: var(--copper); text-transform: uppercase; letter-spacing: 0.9px; margin-top: 4px; }
    .emblem-caption { font-size: 12px; color: #e2e8f0; font-weight: 700; letter-spacing: 0.5px; }

    .list-card {
      background: var(--surface-2);
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 10px;
    }
    .list-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .list-title { font-size: 16px; font-weight: 900; color: var(--ink); }
    .list-meta { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .list-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; }
    .check-row { display: flex; align-items: center; gap: 10px; flex: 1; }
    .big-check { width: 22px; height: 22px; accent-color: var(--navy); cursor: pointer; flex-shrink: 0; }

    .saved-box {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .saved-email { font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 8px; word-break: break-all; }

    .mt-2 { margin-top: 8px; }
    .hidden { display: none !important; }
    .status-msg { margin-top: 10px; font-size: 13px; color: var(--red-dark); font-weight: 700; min-height: 18px; }
    .ok-msg { color: var(--green-dark); }
    .diag-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      font-size: 12px;
      color: #334155;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">
        <span class="brand-num">32</span>
        <span class="brand-acad">academia</span>
      </div>
      <div>
        <div class="brand-title" id="headerTitle">32 Academia</div>
        <div class="brand-sub" id="headerUser">Sistema de Gestão</div>
      </div>
    </div>
    <button id="btnLogout" class="btn-header-light hidden" type="button">Sair da Conta</button>
  </header>

  <main class="container">
    <!-- TELA DE LOGIN -->
    <section id="authSection" class="card">
      <h2>Entrar no Aplicativo</h2>
      <p class="desc">Acesse seu painel de gestão da academia sem travar, mesmo com internet instável.</p>

      <div id="savedAccountBox" class="saved-box hidden mt-2">
        <div class="saved-email" id="savedEmailLabel">Conta salva: ---</div>
        <button id="btnEntrarRapido" class="btn-primary" style="margin-top:0;" type="button">Entrar com Conta Salva</button>
      </div>

      <label for="nomeAcademia">Nome da Academia (opcional)</label>
      <input id="nomeAcademia" type="text" placeholder="Ex.: 32 Academia" />

      <label for="emailInput">E-mail</label>
      <input id="emailInput" type="email" placeholder="seuemail@exemplo.com" />

      <label for="senhaInput">Senha (opcional se entrar local / mín. 6 na nuvem)</label>
      <input id="senhaInput" type="password" placeholder="••••••" />

      <button id="btnLogin" class="btn-primary" type="button">Entrar</button>
      <button id="btnCriarConta" class="btn-secondary mt-2" type="button">Criar Conta Nova</button>
      <button id="btnInstalarApp" class="btn-install hidden" type="button">📲 Instalar Aplicativo no Celular</button>

      <div id="authMsg" class="status-msg"></div>
      <div id="authDiag" class="diag-box">Status: pronto para entrar.</div>
    </section>

    <!-- MENU PRINCIPAL COM RESUMO, BOTÕES E SÍMBOLO EMBAIXO -->
    <section id="menuSection" class="hidden">
      <div class="summary-strip">
        <div class="summary-tile">
          <div class="summary-num" id="sumTotalAlunos">0</div>
          <div class="summary-lbl">Alunos</div>
        </div>
        <div class="summary-tile">
          <div class="summary-num ok" id="sumPagos">0</div>
          <div class="summary-lbl">Pagos</div>
        </div>
        <div class="summary-tile">
          <div class="summary-num pend" id="sumNaoPagos">0</div>
          <div class="summary-lbl">Em Aberto</div>
        </div>
      </div>

      <div class="menu-grid">
        <button type="button" class="menu-btn" data-open="viewAddAluno">
          <span class="menu-btn-left">
            <span class="menu-icon">➕</span>
            <span>
              <span class="menu-title">Adicionar Aluno</span>
              <span class="menu-sub">Ficha completa: nome, endereço, CEP, peso e WhatsApp</span>
            </span>
          </span>
          <span class="menu-arrow">›</span>
        </button>

        <button type="button" class="menu-btn" data-open="viewTodosAlunos">
          <span class="menu-btn-left">
            <span class="menu-
