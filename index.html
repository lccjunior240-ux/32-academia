<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1b2d" />
  <title>32 Academia</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --surface-2: #fafafa;
      --ink: #111111;
      --muted: #52525b;
      --border: #111111;
      --navy: #0f1b2d;
      --navy-2: #172842;
      --copper: #c87d4b;
      --green: #16a34a;
      --green-dark: #15803d;
      --red: #dc2626;
      --red-dark: #b91c1c;
      --whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--ink); min-height: 100vh; padding-bottom: 40px; }

    header {
      background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 100%);
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #ffffff;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-badge {
      width: 52px;
      height: 46px;
      border-radius: 12px;
      background: #0b1320;
      border: 2px solid var(--copper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .brand-num {
      font-size: 17px;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .brand-acad {
      font-size: 8px;
      font-weight: 800;
      color: var(--copper);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 2px;
    }
    .brand-title { font-size: 17px; font-weight: 900; color: #ffffff; }
    .brand-sub { font-size: 11px; color: #cbd5e1; font-weight: 600; }

    .btn-header-light {
      background: #ffffff;
      color: #111111;
      border: 2px solid #111111;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
    }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    h2 { font-size: 17px; font-weight: 900; color: var(--ink); }
    h3 { font-size: 15px; font-weight: 800; margin-bottom: 8px; color: var(--ink); }
    p.desc { font-size: 13px; color: var(--muted); line-height: 1.4; }

    label { display: block; font-size: 12px; color: var(--ink); margin-bottom: 4px; margin-top: 10px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
    }
    textarea { min-height: 76px; resize: vertical; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
      color: var(--ink);
      transition: transform 0.05s, background 0.12s;
    }
    button:active { transform: scale(0.99); }
    button:hover { background: #f4f4f5; }

    .btn-primary {
      background: var(--navy);
      color: #ffffff;
      border: 2px solid var(--border);
      width: 100%;
      margin-top: 14px;
    }
    .btn-primary:hover { background: var(--navy-2); }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--border);
      width: 100%;
    }

    .btn-close-x {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--ink);
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn-exit-bottom {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--ink);
      width: 100%;
      margin-top: 14px;
    }
