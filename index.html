<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>32 Academia</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --surface-2: #fafafa;
      --ink: #111111;
      --muted: #52525b;
      --border: #111111;
      --border-soft: #d4d4d8;
      --green: #16a34a;
      --green-dark: #15803d;
      --red: #dc2626;
      --red-dark: #b91c1c;
      --whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--ink); min-height: 100vh; padding-bottom: 36px; }

    /* CABEÇALHO FUNDO BRANCO COM BORDA PRETA */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: var(--ink);
      flex-shrink: 0;
    }
    .brand-title { font-size: 17px; font-weight: 900; color: var(--ink); }
    .brand-sub { font-size: 11px; color: var(--muted); font-weight: 600; }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    h2 { font-size: 17px; font-weight: 900; color: var(--ink); }
    h3 { font-size: 15px; font-weight: 800; margin-bottom: 8px; color: var(--ink); }
    p.desc { font-size: 13px; color: var(--muted); line-height: 1.4; }

    label { display: block; font-size: 12px; color: var(--ink); margin-bottom: 4px; margin-top: 10px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
    }
    textarea { min-height: 76px; resize: vertical; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
      color: var(--ink);
      transition: transform 0.05s, background 0.12s;
    }
    button:active { transform: scale(0.99); }
    button:hover { background: #f4f4f5; }

    .btn-primary {
      background: var(--ink);
      color: var(--surface);
      border: 2px solid var(--border);
      width: 100%;
      margin-top: 14px;
    }
    .btn-primary:hover { background: #27272a; }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--border);
      width: 100%;
    }

    .btn-close-x {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--ink);
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn-exit-bottom {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--ink);
      width: 100%;
      margin-top: 14px;
    }

    .btn-sm { padding: 8px 11px; font-size: 12px; border-radius: 8px; }
    .btn-wa {
      background: var(--whatsapp);
      color: #052e16;
      border: 2px solid var(--border);
      font-weight: 900;
    }
    .btn-wa:hover { background: #22c55e; }

    .status-pill-btn {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      border: 2px solid var(--border);
    }
    .pill-green { background: var(--green-dark); }
    .pill-green:hover { background: var(--green); }
    .pill-red { background: var(--red-dark); }
    .pill-red:hover { background: var(--red); }

    /* MENU DE BOTÕES: FUNDO BRANCO E BORDA PRETA EM CADA BOTÃO */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .menu-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--ink);
      width: 100%;
    }
    .menu-btn:hover { background: #fafafa; box-shadow: 3px 3px 0 var(--border); }
    .menu-btn-left { display: flex; align-items: center; gap: 14px; }
    .menu-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .menu-title { font-size: 16px; font-weight: 900; display: block; color: var(--ink); }
    .menu-sub { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-top: 2px; }
    .menu-arrow { font-size: 20px; color: var(--ink); font-weight: 900; }

    .list-card {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .list-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .list-title { font-size: 16px; font-weight: 900; color: var(--ink); }
    .list-meta { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .list-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; }
    .check-row { display: flex; align-items: center; gap: 10px; flex: 1; }
    .big-check { width: 22px; height: 22px; accent-color: var(--ink); cursor: pointer; flex-shrink: 0; }

    .mt-2 { margin-top: 8px; }
    .hidden { display: none !important; }
    .status-msg { margin-top: 10px; font-size: 13px; color: var(--red-dark); font-weight: 700; min-height: 18px; }
    .ok-msg { color: var(--green-dark); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-badge">32</div>
      <div>
        <div class="brand-title" id="headerTitle">32 Academia</div>
        <div class="brand-sub" id="headerUser">Sistema de Gestão</div>
      </div>
    </div>
    <button id="btnLogout" class="btn-close-x hidden" type="button">Sair da Conta</button>
  </header>

  <main class="container">
    <!-- TELA DE LOGIN -->
    <section id="authSection" class="card">
      <h2>Entrar ou Criar Conta</h2>
      <p class="desc">Entre com seu e-mail e senha salvos no navegador para abrir os botões do sistema.</p>

      <form id="authForm">
        <label for="nomeAcademia">Nome da Academia (para conta nova)</label>
        <input id="nomeAcademia" type="text" placeholder="Ex.: Academia da Natália" />

        <label for="emailInput">E-mail</label>
        <input id="emailInput" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="username" required />

        <label for="senhaInput">Senha (mínimo 6 caracteres)</label>
        <input id="senhaInput" name="password" type="password" placeholder="••••••" autocomplete="current-password" required />

        <button id="btnLogin" class="btn-primary" type="submit">Entrar</button>
        <button id="btnCriarConta" class="btn-secondary mt-2" type="button">Criar Conta Nova</button>
      </form>

      <div id="authMsg" class="status-msg"></div>
    </section>

    <!-- MENU PRINCIPAL COM OS BOTÕES -->
    <section id="menuSection" class="hidden">
      <div class="menu-grid">
        <button type="button" class="menu-btn" data-open="viewAddAluno">
          <span class="menu-btn-left">
            <span class="menu-icon">➕</span>
            <span>
              <span class="menu-title">Adicionar Aluno</span>
              <span class="menu-sub">Ficha completa: nome, endereço, CEP, peso e WhatsApp</span>
            </span>
          </span>
          <span class="menu-arrow">›</span>
        </button>

        <button type="button" class="menu-btn" data-open="viewTodosAlunos">
          <span class="menu-btn-left">
            <span class="menu-icon">👥</span>
            <span>
              <span class="menu-title">Todos os Alunos (<span id="countMenuAlunos">0</span>)</span>
              <span class="menu-sub">Situação cadastral e botão Verde (Pago) / Vermelho (Não Pago)</span>
            </span>
          </span>
          <span class="menu-arrow">›</span>
        </button>

        <button type="button" class="menu-btn" data-open="viewRelatorio">
          <span
