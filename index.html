<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>32 Academia — Gestão de Alunos</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-2: #262626;
      --input-bg: #161616;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.16);
      --red: #f87171;
      --red-bg: rgba(220, 38, 38, 0.18);
      --whatsapp: #25d366;
      --border: #333333;
      --border-light: #404040;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

    header {
      background: #0a0a0a;
      border-bottom: 2px solid var(--primary);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 17px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
      flex-shrink: 0;
    }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: 0.3px; color: #fff; }
    .brand-sub { font-size: 11px; color: var(--muted); }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; margin-top: 11px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { min-height: 80px; resize: vertical; }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s ease;
    }
    button:active { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; margin-top: 14px; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface-2); border: 1px solid var(--border-light); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
    .btn-danger-outline { background: transparent; border: 1px solid rgba(220, 38, 38, 0.5); color: #fca5a5; }
    .btn-sm { padding: 8px 10px; font-size: 12px; border-radius: 8px; }
    .btn-wa { background: var(--whatsapp); color: #052e16; font-weight: 800; }

    .mt-2 { margin-top: 8px; }
    .hidden { display: none !important; }
    .status-msg { margin-top: 10px; font-size: 13px; color: #fca5a5; min-height: 18px; }
    .ok-msg { color: #86efac; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat-num { font-size: 18px; font-weight: 800; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0 14px;
    }

    .aluno-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .aluno-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .aluno-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .aluno-check { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
    .aluno-info { min-width: 0; }
    .aluno-nome { font-weight: 700; font-size: 15px; color: #fff; }
    .aluno-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-pago { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-pendente { background: var(--red-bg); color: var(--red); border: 1px solid rgba(220, 38, 38, 0.45); }

    .aluno-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0a0a0a;
      border-top: 2px solid var(--border);
      padding: 10px 14px;
      z-index: 25;
    }
    .bottom-bar-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .selected-count { font-size: 13px; font-weight: 800; color: #fff; }
    .selected-sub { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-badge">32</div>
      <div>
        <div class="brand-title" id="headerTitle">32 Academia</div>
        <div class="brand-sub" id="headerUser">Gestão de Alunos e Cobranças</div>
      </div>
    </div>
    <button id="btnLogout" class="btn-outline btn-sm hidden">Sair</button>
  </header>

  <main class="container">
    <!-- TELA DE LOGIN / CADASTRO -->
    <section id="authSection" class="card">
      <h2>Entrar ou Criar Conta na 32 Academia</h2>
      <p style="font-size:13px; color:var(--muted);">
        Cada academia tem seu próprio espaço isolado para gerenciar alunos e cobranças.
      </p>

      <label for="nomeAcademia">Nome da Academia</label>
      <input id="nomeAcademia" type="text" placeholder="Ex.: Academia Natália / 32 Academia" />

      <label for="emailInput">E-mail</label>
      <input id="emailInput" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" />

      <label for="senhaInput">Senha (mínimo 6 caracteres)</label>
      <input id="senhaInput" type="password" placeholder="••••••" autocomplete="current-password" />

      <button id="btnCriarConta" class="btn-primary">Criar Minha Conta e Entrar</button>
      <button id="btnLogin" class="btn-secondary mt-2" style="width:100%;">Já Tenho Conta — Entrar</button>

      <div id="authMsg" class="status-msg"></div>
    </section>

    <!-- PAINEL PRINCIPAL -->
    <section id="appSection" class="hidden">
      <!-- RESUMO RÁPIDO -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" style="color:var(--green);" id="statPagos">0</div>
          <div class="stat-label">Pagos</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" style="color:var(--red);" id="statPendentes">0</div>
          <div class="stat-label">Pendentes</div>
        </div>
      </div>

      <!-- DADOS DE RECEBIMENTO -->
      <div class="card">
        <h2>Recebimento e Mensagem</h2>
        <label for="recebedorNome">Recebedor</label>
        <input id="recebedorNome" type="text" value="Luíz Carlos Costa Júnior" />

        <label for="chavePixDados">Chave PIX / Dados para Pagamento</label>
        <input id="chavePixDados" type="text" placeholder="Ex.: Chave PIX ou instruções de pagamento" />

        <label for="mensagemPadrao">Mensagem de Cobrança / Aviso</label>
        <textarea id="mensagemPadrao">Olá! Passando para lembrar da mensalidade da academia. Pagamento em nome de {
